spring:
  application:
    name: user-service
  threads:
    virtual:
      enabled: true
  sql:
    init:
      mode: always
  jpa:
    defer-datasource-initialization: true
    show-sql: false
  grpc:
    server:
      port: ${GRPC_PORT:9090}

management:
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true

app:
  jwt:
    secret: ${JWT_SECRET}
    issuer: ${JWT_ISSUER:saga-ecosystem-auth}
    expiration-ms: ${JWT_EXPIRATION_MS:3600000}

---
spring:
  config:
    activate:
      on-profile: default
  datasource:
    url: jdbc:h2:mem:user_db;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password: password
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update

---
spring:
  config:
    activate:
      on-profile: postgres
  datasource:
    url: jdbc:postgresql://${DATABASE_HOST:localhost}:${DATABASE_PORT:5432}/saga_db?currentSchema=user_service_schema
    driver-class-name: org.postgresql.Driver
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
