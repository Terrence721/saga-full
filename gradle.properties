# Six independent modules (only user-service/api-gateway-service depend on
# user-contract; order/payment/restaurant-service have zero inter-module deps) -
# well-suited to parallel project execution. Caching reuses unchanged modules'
# outputs across runs; CI's setup-gradle@v4 action already persists ~/.gradle/caches.
org.gradle.caching=true
org.gradle.parallel=true
