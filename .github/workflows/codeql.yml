name: CodeQL

on:
  push:
  pull_request:
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (java-kotlin)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      security-events: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: java-kotlin
          queries: security-extended

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # --no-build-cache: with org.gradle.caching=true (repo-wide, for the
      # Quality workflow's own speed), a warm cache lets this restore every
      # compileJava output instead of actually invoking javac - CodeQL's
      # build tracer then observes zero real compilation and fails with
      # "could not process any code written in Java/Kotlin". `clean` on top,
      # for certainty against local up-to-date checks too, not just the
      # build cache.
      - name: Build (for CodeQL to trace)
        run: ./gradlew clean build -x test --no-build-cache

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: '/language:java-kotlin'
