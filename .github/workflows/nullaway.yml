name: NullAway (experimental, JDK 21)

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'order-service/**'

jobs:
  nullaway:
    name: NullAway on order-service (JDK 21)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - name: Run NullAway
        run: ./gradlew :order-service:compileJava -Pnullaway --no-daemon
