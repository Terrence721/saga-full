apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: vault-backend
  namespace: saga-ecosystem
spec:
  provider:
    vault:
      # Replace with your real Vault endpoint.
      server: "https://vault.example.com"
      path: "secret"
      version: "v2"
      auth:
        kubernetes:
          mountPath: "kubernetes"
          role: "saga-ecosystem"
          serviceAccountRef:
            name: "saga-ecosystem"
