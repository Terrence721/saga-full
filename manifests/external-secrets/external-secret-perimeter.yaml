apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: perimeter-security-spec
  namespace: saga-ecosystem
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: vault-backend
    kind: SecretStore
  target:
    name: perimeter-security-spec
    creationPolicy: Owner
  data:
    - secretKey: JWT_SECRET
      remoteRef:
        key: "saga/ecosystem"
        property: "jwt_secret"
    - secretKey: DATABASE_USER
      remoteRef:
        key: "saga/ecosystem"
        property: "database_user"
    - secretKey: DATABASE_PASSWORD
      remoteRef:
        key: "saga/ecosystem"
        property: "database_password"
    - secretKey: USER_SERVICE_DATABASE_USER
      remoteRef:
        key: "saga/ecosystem"
        property: "user_service_database_user"
    - secretKey: USER_SERVICE_DATABASE_PASSWORD
      remoteRef:
        key: "saga/ecosystem"
        property: "user_service_database_password"
    - secretKey: ORDER_SERVICE_DATABASE_USER
      remoteRef:
        key: "saga/ecosystem"
        property: "order_service_database_user"
    - secretKey: ORDER_SERVICE_DATABASE_PASSWORD
      remoteRef:
        key: "saga/ecosystem"
        property: "order_service_database_password"
    - secretKey: PAYMENT_SERVICE_DATABASE_USER
      remoteRef:
        key: "saga/ecosystem"
        property: "payment_service_database_user"
    - secretKey: PAYMENT_SERVICE_DATABASE_PASSWORD
      remoteRef:
        key: "saga/ecosystem"
        property: "payment_service_database_password"
    - secretKey: RESERVATION_SERVICE_DATABASE_USER
      remoteRef:
        key: "saga/ecosystem"
        property: "reservation_service_database_user"
    - secretKey: RESERVATION_SERVICE_DATABASE_PASSWORD
      remoteRef:
        key: "saga/ecosystem"
        property: "reservation_service_database_password"
    - secretKey: RESTAURANT_SERVICE_DATABASE_USER
      remoteRef:
        key: "saga/ecosystem"
        property: "restaurant_service_database_user"
    - secretKey: RESTAURANT_SERVICE_DATABASE_PASSWORD
      remoteRef:
        key: "saga/ecosystem"
        property: "restaurant_service_database_password"
