apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: perimeter-security-spec
  namespace: saga-ecosystem
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: vault-backend
    kind: SecretStore
  target:
    name: perimeter-security-spec
    creationPolicy: Owner
  data:
    - secretKey: JWT_SECRET
      remoteRef:
        key: "saga/ecosystem"
        property: "jwt_secret"
    - secretKey: DATABASE_USER
      remoteRef:
        key: "saga/ecosystem"
        property: "database_user"
    - secretKey: DATABASE_PASSWORD
      remoteRef:
        key: "saga/ecosystem"
        property: "database_password"
