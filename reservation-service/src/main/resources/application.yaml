spring:
  application:
    name: reservation-service
  datasource:
    url: jdbc:h2:mem:reservation;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: update
server:
  port: 8084
management:
  endpoints:
    web:
      exposure:
        include: health,info
