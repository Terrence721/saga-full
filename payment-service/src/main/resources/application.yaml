spring:
  application:
    name: payment-service
  threads:
    virtual:
      enabled: true
  jpa:
    show-sql: false
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      auto-offset-reset: earliest

server:
  port: ${SERVER_PORT:8082}

management:
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true

app:
  outbox:
    topic: ${OUTBOX_TOPIC:payment-processed-topic}
    batch-size: ${OUTBOX_BATCH_SIZE:10}
    polling-delay-ms: ${OUTBOX_POLLING_DELAY_MS:500}
    send-timeout-ms: ${OUTBOX_SEND_TIMEOUT_MS:10000}
  payment:
    max-amount: ${PAYMENT_MAX_AMOUNT:500.00}

---
spring:
  config:
    activate:
      on-profile: default
  datasource:
    url: jdbc:h2:mem:payment_db;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password: password
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update

---
spring:
  config:
    activate:
      on-profile: postgres
  datasource:
    url: jdbc:postgresql://${DATABASE_HOST:localhost}:${DATABASE_PORT:5432}/saga_db?currentSchema=payment_service_schema
    driver-class-name: org.postgresql.Driver
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
