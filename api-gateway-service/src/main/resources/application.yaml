# ===================================================================
# 1. RUNTIME SERVER CONFIGURATION
# ===================================================================
server:
  port: ${GATEWAY_PORT:8080}

# ===================================================================
# 2. SPRING CORE FRAMEWORK SETTINGS
# ===================================================================
spring:
  application:
    name: api-gateway-service

  threads:
    virtual:
      enabled: true

  cloud:
    gateway:
      server:
        webflux:
          # Route table for Gateway-routed paths only. CORS is handled globally by
          # GlobalCorsConfig's CorsWebFilter, which applies to every HandlerMapping,
          # regardless of whether the path is proxied or served locally.
          routes:
            # Route 1: Guarded Edge Route to Order Microservice (create)
            - id: order-service-route
              uri: 'http://${ORDER_SERVICE_HOST:localhost}:${ORDER_SERVICE_PORT:8081}'
              predicates:
                - Path=/orders
                - Method=POST,OPTIONS
              filters:
                # Invokes com.example.saga.gateway.filter.JwtPerimeterGuardGatewayFilterFactory
                - JwtPerimeterGuard
                - RemoveRequestHeader=Cookie
                - name: CircuitBreaker
                  args:
                    name: orderServiceCircuitBreaker
                    fallbackUri: forward:/fallback/orders

            # Route 2: Guarded Edge Route to Order Microservice - point-in-time lookup
            - id: order-get-route
              uri: 'http://${ORDER_SERVICE_HOST:localhost}:${ORDER_SERVICE_PORT:8081}'
              predicates:
                - Path=/orders/{id}
                - Method=GET,OPTIONS
              filters:
                - JwtPerimeterGuard
                - RemoveRequestHeader=Cookie
              # No CircuitBreaker filter, unlike Route 1: a read-only status check is
              # lower-stakes than order creation - a deliberate v1 choice, not an oversight.

            # Route 3: Guarded Edge Route to Order Microservice - live status stream
            - id: order-stream-route
              uri: 'http://${ORDER_SERVICE_HOST:localhost}:${ORDER_SERVICE_PORT:8081}'
              predicates:
                - Path=/orders/{id}/stream
                - Method=GET,OPTIONS
              filters:
                - JwtPerimeterGuard
                - RemoveRequestHeader=Cookie


            # Route 4: Guarded Edge Route to Reservation Microservice
            - id: reservation-service-route
              uri: 'http://${RESERVATION_SERVICE_HOST:localhost}:${RESERVATION_SERVICE_PORT:8084}'
              predicates:
                - Path=/reservations,/reservations/**
                - Method=GET,POST,DELETE,OPTIONS
              filters:
                - JwtPerimeterGuard
                - RemoveRequestHeader=Cookie


            # Route 5: Guarded Edge Route to Restaurant Microservice - menu catalog
            - id: restaurant-menu-route
              uri: 'http://${RESTAURANT_SERVICE_HOST:localhost}:${RESTAURANT_SERVICE_PORT:8083}'
              predicates:
                - Path=/menu,/menu/**
                - Method=GET,OPTIONS
              filters:
                - JwtPerimeterGuard
                - RemoveRequestHeader=Cookie

# ===================================================================
# 3. ACTUATOR HEALTH PROBES
# ===================================================================
management:
  endpoints:
    web:
      exposure:
        include:
        - health

  endpoint:
    health:
      probes:
        enabled: true
      show-details: always

# ===================================================================
# 4. DIAGNOSTIC LOGGING LEVELS
# ===================================================================
logging:
  level:
    root: INFO
  include-application-name: true

# ===================================================================
# 5. RESILIENCE4J CIRCUIT BREAKER
# ===================================================================
resilience4j:
  circuitbreaker:
    instances:
      orderServiceCircuitBreaker:
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 10              # Tracks last 10 requests to evaluate health
        failureRateThreshold: 50           # Trips circuit if 50% or more requests fail
        waitDurationInOpenState: 15000ms   # Wait 15 seconds in OPEN state before trying again (HALF-OPEN)
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
  # Spring Cloud Circuit Breaker's Resilience4j reactive integration pairs a
  # TimeLimiter with a CircuitBreaker by matching instance name. Left
  # unconfigured, Resilience4j silently falls back to its library default of
  # 1 second - fine for a direct localhost call, but too tight for a real
  # cross-container call: verified against the real Dockerized stack, the
  # very first order-service call (cold DNS resolution + connection-pool
  # warmup on the Docker bridge network) took long enough to trip this
  # default and fall back, even though order-service went on to process it
  # successfully a moment later. Every call after the first stayed well
  # under 5s.
  timelimiter:
    instances:
      orderServiceCircuitBreaker:
        timeout-duration: 5s

# ===================================================================
# 6. CUSTOM APPLICATION PROPERTIES
# ===================================================================
app:
  jwt:
    secret: ${JWT_SECRET}
    issuer: ${JWT_ISSUER:saga-ecosystem-auth}
