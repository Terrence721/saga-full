# ===================================================================
# 1. RUNTIME SERVER CONFIGURATION
# ===================================================================
server:
  port: ${GATEWAY_PORT:8080}

# ===================================================================
# 2. SPRING CORE FRAMEWORK SETTINGS
# ===================================================================
spring:
  application:
    name: api-gateway-service

  threads:
    virtual:
      enabled: true

  # --- Spring gRPC Client Configuration ---
  grpc:
    client:
      channels:
        # Match name exactly to let Spring auto-wire the UserIdentityServiceBlockingStub bean
        userService:
          address: 'static://${USER_SERVICE_GRPC_HOST:localhost}:${GRPC_PORT:9090}'
          negotiation-type: plaintext # No TLS for local development

  cloud:
    gateway:
      server:
        webflux:
          globalcors:
            cors-configurations:
              '[/**]':
                allowedOrigins: '${FRONTEND_ORIGIN:http://localhost:5180}'
                allowedMethods:
                  - GET
                  - POST
                allowedHeaders:
                  - Authorization
                  - Content-Type
          routes:
            # Route 1: Edge Authentication Endpoint Forwarder
            - id: auth-token-route
              uri: forward:/auth/login
              predicates:
                - Path=/auth/login
                # OPTIONS alongside POST: Spring Cloud Gateway's Method predicate matches
                # the request's own method with no preflight-awareness, so a route without
                # OPTIONS here never matches a real browser's CORS preflight at all -
                # getHandlerInternal returns no handler, globalcors's CORS-processing step
                # (chained onto that result) never runs, and the request falls through
                # unrouted. Verified for real: a preflight without this got rejected before
                # any CORS config was even consulted. Adding OPTIONS is safe - a matched
                # preflight is still short-circuited by Spring's own handler mapping before
                # any route filter (JwtPerimeterGuard included) runs.
                - Method=POST,OPTIONS

            # Route 2: Guarded Edge Route to Order Microservice
            - id: order-service-route
              uri: 'http://${ORDER_SERVICE_HOST:localhost}:${ORDER_SERVICE_PORT:8081}'
              predicates:
                - Path=/orders
                - Method=POST,OPTIONS
              filters:
                # Invokes io.github.terrence721.saga.gateway.filter.JwtPerimeterGuardGatewayFilterFactory
                - JwtPerimeterGuard
                - RemoveRequestHeader=Cookie
                - name: CircuitBreaker
                  args:
                    name: orderServiceCircuitBreaker
                    fallbackUri: forward:/fallback/orders

            # Route 3: Guarded Edge Route to Order Microservice - point-in-time lookup
            - id: order-get-route
              uri: 'http://${ORDER_SERVICE_HOST:localhost}:${ORDER_SERVICE_PORT:8081}'
              predicates:
                - Path=/orders/{id}
                - Method=GET,OPTIONS
              filters:
                - JwtPerimeterGuard
                - RemoveRequestHeader=Cookie
              # No CircuitBreaker filter, unlike Route 2: a read-only status check is
              # lower-stakes than order creation - a deliberate v1 choice, not an oversight.

            # Route 4: Guarded Edge Route to Order Microservice - live status stream
            - id: order-stream-route
              uri: 'http://${ORDER_SERVICE_HOST:localhost}:${ORDER_SERVICE_PORT:8081}'
              predicates:
                - Path=/orders/{id}/stream
                - Method=GET,OPTIONS
              filters:
                - JwtPerimeterGuard
                - RemoveRequestHeader=Cookie

# ===================================================================
# 3. ACTUATOR HEALTH PROBES
# ===================================================================
management:
  endpoints:
    web:
      exposure:
        include:
        - health

  endpoint:
    health:
      probes:
        enabled: true
      show-details: always

# ===================================================================
# 4. DIAGNOSTIC LOGGING LEVELS
# ===================================================================
logging:
  level:
    root: INFO
  include-application-name: true

# ===================================================================
# 5. RESILIENCE4J CIRCUIT BREAKER
# ===================================================================
resilience4j:
  circuitbreaker:
    instances:
      orderServiceCircuitBreaker:
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 10              # Tracks last 10 requests to evaluate health
        failureRateThreshold: 50           # Trips circuit if 50% or more requests fail
        waitDurationInOpenState: 15000ms   # Wait 15 seconds in OPEN state before trying again (HALF-OPEN)
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
  # Spring Cloud Circuit Breaker's Resilience4j reactive integration pairs a
  # TimeLimiter with a CircuitBreaker by matching instance name. Left
  # unconfigured, Resilience4j silently falls back to its library default of
  # 1 second - fine for a direct localhost call, but too tight for a real
  # cross-container call: verified against the real Dockerized stack, the
  # very first order-service call (cold DNS resolution + connection-pool
  # warmup on the Docker bridge network) took long enough to trip this
  # default and fall back, even though order-service went on to process it
  # successfully a moment later. Every call after the first stayed well
  # under 5s.
  timelimiter:
    instances:
      orderServiceCircuitBreaker:
        timeout-duration: 5s

# ===================================================================
# 6. CUSTOM APPLICATION PROPERTIES
# ===================================================================
app:
  jwt:
    secret: ${JWT_SECRET}
    issuer: ${JWT_ISSUER:saga-ecosystem-auth}
